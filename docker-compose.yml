services:
  portfolio:
    build: .
    container_name: portfolio
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      # Loopback only: put a reverse proxy (nginx) in front for HTTPS.
      - "127.0.0.1:3300:3300"
    volumes:
      # The SQLite content store and uploaded images live here, outside the image.
      - ./data:/app/data
